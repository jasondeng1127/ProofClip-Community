name: release-readiness

# Development gates live in ci.yml. This workflow is the release layer: it is
# triggered manually or by a v0.8.0* tag push, re-runs every development gate
# in a clean checkout, and validates the tag policy. The authoritative
# release-audit --release-ready must be executed in the environment that holds
# the release record and artifact (local cut), per docs/release-rehearsal-0.8.md.

on:
  workflow_dispatch:
  push:
    tags: ['v0.8.0*']

jobs:
  readiness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tag policy (v<version>[-rcN] at HEAD)
        shell: pwsh
        run: |
          $version = (Get-Content extension/src/manifest.json -Raw | ConvertFrom-Json).version
          $tags = git tag --points-at HEAD
          $policy = "^v" + [regex]::Escape($version) + "(?:-rc\d+)?$"
          if (-not ($tags -match $policy)) {
            Write-Error "no tag matching policy v$version[-rcN] at HEAD; got: $tags"
            exit 1
          }
          Write-Output "tag policy OK: $tags"
      - name: Pipeline + governance self-tests
        run: node --test release/tests/export-pipeline.test.mjs release/tests/release-governance.test.mjs
      - name: Extension suite (incl. public-source guard)
        run: node --test '.\tests\*.test.mjs'
        working-directory: extension/src
      - name: Worker suite
        run: node --test '.\tests\*.test.mjs'
        working-directory: worker/src
      - name: Public-source gate
        run: pwsh -NoProfile -File scripts/verify-public-source.ps1 -IncludeUntracked
      - name: Commercial-boundary scan
        run: node release/verify-generated-tree.mjs --tree . --repo
      - name: Release-readiness note
        shell: pwsh
        run: Write-Output "Run 'node release/release-audit.mjs --release-ready' in the environment holding release/records + release/artifacts for the authoritative gate."
